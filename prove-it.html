<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>airakaaz - prove it</title>
    
    <!-- Favicon -->
    <link rel="icon" href="kaz.svg" type="image/svg+xml">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="prove-it.css">

    <!-- Prevent FOUC for theme persistence -->
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('theme');
                if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>

    <!-- Script -->
    <script src="prove-it.js" defer></script>
</head>
<body>

    <h1 class="huge-title">prove it</h1>
    
    <form id="prove-it-form">
        <input type="password" id="passphrase" name="passphrase" placeholder="passphrase" aria-label="passphrase" autocomplete="off" autofocus>
        <button type="submit" aria-label="Submit">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
    </form>
    
    <div id="prove-it-message" class="message-box"></div>
    
    <a href="index.html" class="nvm-btn">nvm</a>

</body>
</html>
