<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>airakaaz - prove it</title>

        <!-- Favicon -->
        <link rel="icon" href="../assets/kaz.svg" type="image/svg+xml" />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />

        <!-- Styles -->
        <link rel="stylesheet" href="style.css" />

        <!-- Prevent FOUC for theme persistence -->
        <script>
            (function () {
                try {
                    var theme = localStorage.getItem("theme");
                    if (
                        theme === "dark" ||
                        (!theme &&
                            window.matchMedia("(prefers-color-scheme: dark)")
                                .matches)
                    ) {
                        document.documentElement.setAttribute(
                            "data-theme",
                            "dark",
                        );
                    }
                } catch (e) {}
            })();
        </script>

        <!-- Script -->
        <script src="prove-it.js" defer></script>
    </head>
    <body>
        <h1 class="huge-title">prove it</h1>

        <form id="prove-it-form">
            <label class="visually-hidden" for="passphrase">Passphrase</label>
            <input
                type="password"
                id="passphrase"
                name="passphrase"
                placeholder="passphrase"
                autocomplete="off"
                autofocus
            />
            <button type="submit" aria-label="Submit passphrase">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="28"
                    height="28"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div
            id="prove-it-message"
            class="message-box"
            role="status"
            aria-live="polite"
            aria-atomic="true"
        ></div>

        <a href="/" class="nvm-btn">nvm</a>
    </body>
</html>
